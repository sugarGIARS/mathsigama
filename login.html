<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · MathSigma</title>
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/main.css">
<!-- 悬停即预渲染：点到时目标页已在后台渲染完成，切换近乎瞬间 -->
<script type="speculationrules">
{
  "prerender": [{
    "where": { "and": [
      { "href_matches": "/*.html*" },
      { "not": { "href_matches": "/admin.html*" } }
    ] },
    "eagerness": "moderate"
  }]
}
</script>
</head>
<body>

<div class="auth-wrap">
  <aside class="auth-side">
    <div class="container-inner">
      <div class="brand" style="margin-bottom:26px">
        <span class="brand-mark"><b>Σ</b></span>
        <span class="brand-text"><span class="brand-name" style="color:#fff">MathSigma</span><span class="brand-sub">数理 · 人文课堂</span></span>
      </div>
      <h2>欢迎回来，继续保持手感</h2>
      <p>登录后系统会记住你的年级、学习进度、错题本与学习报告。</p>
      <div class="auth-quote">「学而后知不足，教而后知困。」<br>—— 《礼记 · 学记》</div>
      <ul class="bullets">
        <li><b>1</b><span>按年级精准推送知识点与习题</span></li>
        <li><b>2</b><span>错题自动归档，薄弱点自动标红</span></li>
        <li><b>3</b><span>AI 老师随时在线，引导式讲解</span></li>
      </ul>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-box">
      <h2>登录</h2>
      <p class="sub">使用用户名或手机号登录即可</p>

      <form id="login-form" novalidate>
        <div class="field" id="f-name">
          <label for="in-name">用户名 / 手机号</label>
          <div class="wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
            <input class="input" id="in-name" placeholder="请输入用户名或手机号" autocomplete="username">
          </div>
          <div class="err">请输入用户名或手机号</div>
        </div>

        <div class="field" id="f-pwd">
          <label for="in-pwd">密码</label>
          <div class="wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input class="input" id="in-pwd" type="password" placeholder="请输入密码（至少 6 位）" autocomplete="current-password">
          </div>
          <div class="err">密码至少 6 位</div>
        </div>

        <div class="check-row" style="margin-bottom:18px">
          <label class="switch"><input type="checkbox" id="in-remember" checked><i></i><span>记住登录状态</span></label>
          <a href="register.html" data-link style="color:var(--gold-500);font-weight:600">还没有账号？去注册</a>
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%" id="btn-login">登 录</button>
      </form>

      <div class="divider" style="margin:22px 0 16px"></div>
      <button class="btn btn-ghost" style="width:100%" id="btn-demo">使用体验账号快速进入</button>

      <div class="auth-alt">忘记密码？可在个人中心中修改，或使用体验账号</div>
    </div>
  </main>
</div>

<div id="footer-root" style="display:none"></div>

<script src="assets/vendor/katex/katex.min.js" defer></script>
<script src="assets/vendor/katex/contrib/auto-render.min.js" defer></script>
<script src="assets/js/data-core.js"></script>
<script src="assets/js/data-kp1.js"></script>
<script src="assets/js/data-kp2.js"></script>
<script src="assets/js/data-kp3.js"></script>
<script src="assets/js/data-q1.js"></script>
<script src="assets/js/data-q2.js"></script>
<script src="assets/js/data-q3.js"></script>
<script src="assets/js/data-q4.js"></script>
<script src="assets/js/data-q5.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/transition.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
