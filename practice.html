<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>习题练习 · MathSigma</title>
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/main.css">
<!-- 悬停即预渲染：点到时目标页已在后台渲染完成，切换近乎瞬间 -->
<script type="speculationrules">
{
  "prerender": [{
    "where": { "and": [
      { "href_matches": "/*.html*" },
      { "not": { "href_matches": "/admin.html*" } }
    ] },
    "eagerness": "moderate"
  }]
}
</script>
</head>
<body>

<div id="nav-root"></div>

<header class="page-head">
  <div class="container">
    <div class="crumb"><a href="index.html" data-link>首页</a><span>/</span><span>习题练习</span><span>/</span><span id="crumb-kp">分层题库</span></div>
    <h1>习题练习 · 即时判分</h1>
    <p>基础 → 提高 → 挑战，三级难度；选择、填空、解答题全覆盖。提交后立即判分并给出解析，错题自动进入错题本。</p>
  </div>
</header>

<section class="section" style="padding-top:36px">
  <div class="container">
    <div class="practice-layout">
      <main>
        <div class="q-toolbar">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <select class="select" id="sel-kp" style="width:auto;min-width:220px"></select>
            <div class="level-tabs" id="level-tabs">
              <button class="level-tab on" data-level="all">全部</button>
              <button class="level-tab" data-level="basic">基础</button>
              <button class="level-tab" data-level="advance">提高</button>
              <button class="level-tab" data-level="challenge">挑战</button>
            </div>
            <button class="btn btn-ghost btn-sm" id="btn-mistake-mode">只做错题</button>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <span class="timer" id="timer">00:00</span>
            <button class="btn btn-primary btn-sm" id="btn-submit-all">提交全部</button>
          </div>
        </div>

        <div id="q-list"></div>
      </main>

      <aside>
        <div class="card score-panel">
          <div class="side-title">本次练习</div>
          <div class="score-ring">
            <svg width="170" height="170" viewBox="0 0 170 170">
              <circle cx="85" cy="85" r="72" fill="none" stroke="var(--line)" stroke-width="10"/>
              <circle cx="85" cy="85" r="72" fill="none" stroke="url(#g1)" stroke-width="10" stroke-linecap="butt"
                      stroke-dasharray="452" stroke-dashoffset="452" id="ring-path"/>
              <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1e3ac6"/><stop offset="100%" stop-color="#0f6b52"/>
              </linearGradient></defs>
            </svg>
            <div class="val"><b id="ring-val">0%</b><span>正确率</span></div>
          </div>
          <div style="margin-top:6px">
            <div class="stat-row"><span>已提交</span><b id="s-done">0 / 0</b></div>
            <div class="stat-row"><span>答对</span><b id="s-right" style="color:var(--jade-500)">0</b></div>
            <div class="stat-row"><span>答错</span><b id="s-wrong" style="color:var(--cinnabar)">0</b></div>
            <div class="stat-row"><span>用时</span><b id="s-time">0:00</b></div>
          </div>
          <div class="divider"></div>
          <div class="side-title">错题本（未攻克）</div>
          <div class="mistake-list" id="mini-mistakes"></div>
          <div class="divider"></div>
          <a class="btn btn-ghost btn-sm" style="width:100%" href="profile.html#report" data-link>查看学习报告</a>
          <a class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" href="ai.html" data-link>不懂？去问 AI 老师</a>
        </div>
      </aside>
    </div>
  </div>
</section>

<div id="footer-root"></div>

<script src="assets/vendor/katex/katex.min.js" defer></script>
<script src="assets/vendor/katex/contrib/auto-render.min.js" defer></script>
<script src="assets/js/data-core.js"></script>
<script src="assets/js/data-kp1.js"></script>
<script src="assets/js/data-kp2.js"></script>
<script src="assets/js/data-kp3.js"></script>
<script src="assets/js/data-q1.js"></script>
<script src="assets/js/data-q2.js"></script>
<script src="assets/js/data-q3.js"></script>
<script src="assets/js/data-q4.js"></script>
<script src="assets/js/data-q5.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/transition.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/practice.js"></script>
</body>
</html>
